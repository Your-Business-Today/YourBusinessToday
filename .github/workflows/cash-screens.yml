name: cash screens

# Vercel's Hobby plan runs a cron once a day at most, so this workflow knocks on the site's cron door every
# five minutes instead. The door carries on the oldest screen of a territory for cash that staff have started,
# for four minutes at a time, and answers at once when no screen is waiting. The knock never fails the
# workflow: a door that answers anything but 200 is a warning in the log, because a red run here would raise
# a FIX task on the project every five minutes.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cash-screens
  cancel-in-progress: false

jobs:
  knock:
    name: Carry on the cash screens staff have started
    runs-on: ubuntu-latest
    steps:
      - run: |
          status="$(curl --silent --show-error --location-trusted --max-time 320 --output answer.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" "$DOOR" || true)"
          cat answer.json; echo
          if [ "$status" != "200" ]; then echo "::warning::The cron door answered $status. Set CRON_SECRET on Vercel and as this repository's secret, the same value."; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DOOR: https://www.yourbusiness.today/api/watch/cash_screens
