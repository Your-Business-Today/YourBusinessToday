name: make brand film

# Makes one video a brand's piece asked for, from chat (make_content_video) or the piece's page (Make the video). The
# site starts this workflow with the request's id; the run asks the site's door what to film with the cron secret, as
# the watch doors are knocked, photographs the words of each shot on the site's filming page, has ffmpeg lay them over
# the client's footage and music, sends the MP4 to the brand's library and tells the door that it arrived or why it was
# not made. A film that could not be made is kept on the piece as failed with its reason, so the run is not failed for
# it: a red run here would raise a FIX task for what is the client's footage, not the code.

on:
  workflow_dispatch:
    inputs:
      filmMakingId:
        description: The id of the request for the film, as the site gives it
        required: true
        type: string

concurrency:
  group: make-brand-film-${{ inputs.filmMakingId }}

jobs:
  film:
    name: Make the brand film
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install the recorder's browser
        run: |
          npm install --prefix "$RUNNER_TEMP/recorder" --no-save playwright@1.48.2
          "$RUNNER_TEMP/recorder/node_modules/.bin/playwright" install --with-deps chromium
      - name: Film it and send it to the library
        run: node scripts/promo/makeBrandFilm.ts "$FILM_MAKING_ID"
        env:
          FILM_MAKING_ID: ${{ inputs.filmMakingId }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.yourbusiness.today
          NODE_PATH: ${{ runner.temp }}/recorder/node_modules
