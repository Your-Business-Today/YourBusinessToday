name: deploy windows

# A further try at the deploy windows. Vercel's crons in vercel.json are the knock that is relied on: one in
# every hour of the day, so a window set on the hour opens within that hour. GitHub does not keep this
# quarter-hour schedule on this repository: while it was the only knock, from 8 to 14 November 2026, the
# midnight windows opened between 01:40 and 05:49. When its knock does come, it opens a window set between
# the hours sooner than the next hour's knock would. The door opens the staging-to-main pull request of
# every project whose deploy time has come, and a window runs once a day however often the door is knocked,
# so a knock that comes late or twice does no harm. Actions minutes are free on this public repository. The
# knock never fails the workflow: a door that answers anything but 200 is a warning in the log, because a
# red run here would raise a FIX task on the project every quarter hour.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  knock:
    name: Open the deploy windows that have come
    runs-on: ubuntu-latest
    steps:
      - run: |
          status="$(curl --silent --show-error --location-trusted --output answer.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" "$DOOR")"
          cat answer.json; echo
          if [ "$status" != "200" ]; then echo "::warning::The cron door answered $status. Set CRON_SECRET on Vercel and as this repository's secret, the same value."; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DOOR: https://www.yourbusiness.today/api/watch/deploy_windows
