name: billing schedules

# A further try at the billing run. Vercel's crons in vercel.json are what knock it on time: at five past six, seven and
# eight UTC each day, so a knock lands between 07:00 and 08:00 UK time in summer and in winter. GitHub does not keep this
# hourly schedule on this repository (it went five hours without a run on 14 Nov 2026), so this knock is only an extra
# try when it does come: each organisation's schedules whose day has come raise their invoice, and the ones that send by
# themselves issue and email it. The door does nothing before 07:00 UK time, and one period is never invoiced twice, so
# a knock that comes twice or late does no harm. The knock never fails the workflow, as the deploy windows' does not:
# a door that answers anything but 200 is a warning in the log, because a red run here would raise a FIX task each time.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  knock:
    name: Raise and send the billing schedules' invoices that are due
    runs-on: ubuntu-latest
    steps:
      - run: |
          status="$(curl --silent --show-error --location-trusted --output answer.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" "$DOOR")"
          cat answer.json; echo
          if [ "$status" != "200" ]; then echo "::warning::The cron door answered $status. Set CRON_SECRET on Vercel and as this repository's secret, the same value."; fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DOOR: https://www.yourbusiness.today/api/watch/billing_schedules
