name: connector self-check

# After every production deploy, the deployed connector checks itself against the live database: it keeps every
# promise of src/lib/server/mcp/pipelineContract.json and answers a set of reads without an error. The check runs
# on the site, behind the cron door, so it signs in with CRON_SECRET as the deploy windows knock does. It only
# reads. Unlike that knock, a failure here fails the workflow, so it shows red in GitHub once for the deploy.
#
# Vercel reports a deployment a success a few seconds before the domain moves to it, and while the deploy's
# migrations may still be running, so the knock (scripts/self-check/) first waits for the deployed commit's
# run migrations run to finish, then knocks until the door answers from that commit. It gives up, red, after
# ten minutes. Started by hand, it checks the head of the default branch.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Check the connector against the live database
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/self-check/knock-connector-self-check.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DOOR: https://www.yourbusiness.today/api/watch/connector_self_check
          COMMIT: ${{ github.event.deployment.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
