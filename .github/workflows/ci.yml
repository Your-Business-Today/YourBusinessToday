name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse a migration that would lose data, added or changed
        if: github.event_name == 'pull_request'
        run: node scripts/migrations/check-added-migrations.mjs "${{ github.event.pull_request.base.sha }}"
      - name: Decide whether the next deploy's migrations need rehearsing
        id: rehearsal
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          changedFiles=$(git diff --name-only "$BASE_COMMIT" HEAD -- migrations scripts/run-added-migrations.sh scripts/migrations docs/sql/base-schema.sql docs/sql/fix-everything.sql .github/workflows/ci.yml)
          if [ -n "$changedFiles" ]; then
            echo "This pull request changes what the deploy runs:"
            echo "$changedFiles"
            echo "is_due=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start a scratch Postgres for the rehearsal
        if: steps.rehearsal.outputs.is_due == 'true'
        run: ./scripts/migrations/start-scratch-postgres.sh
      - name: Rehearse the next deploy's migrations, twice, on a scratch database
        if: steps.rehearsal.outputs.is_due == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./scripts/migrations/rehearse-added-migrations.sh "$(git rev-parse "origin/$DEFAULT_BRANCH")"
      - name: Prove the record of applied migrations finishes a run that failed part way
        if: steps.rehearsal.outputs.is_due == 'true'
        run: |
          ./scripts/migrations/prove-migration-record.sh
          ./scripts/migrations/prove-first-run-that-never-began.sh
      - run: npm test
      - run: npm run build
